name: Radar semanal do acervo

# ⛔ COMMIT SO' NO FIM, NUM PASSO UNICO.
#    Empurrar durante a corrida do radar faz o runner perder tudo -- ja'
#    custou 95 videos e 2h26. Por isso nao ha' `git push` no meio deste
#    arquivo, e os estagios passam resultado por artefato, nao por commit.

on:
  schedule:
    - cron: "0 6 * * 1"        # segunda-feira, 06:00 UTC
  workflow_dispatch:
    inputs:
      so_codigo:
        description: "rodar um canal so' (ex.: C001). Vazio = todos."
        required: false
        default: ""
      seco:
        description: "true = so' o radar, nao gasta credito nem token"
        required: false
        default: "false"

concurrency:
  # ⛔ duas corridas ao mesmo tempo escreveriam o mesmo manifesto e uma
  #    apagaria os IDs da outra.
  group: radar-acervo
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar yt-dlp
        run: pip install --quiet --upgrade yt-dlp

      - name: Trazer dicionario e manifestos (fora do repo, por desenho)
        env:
          DICIONARIO_B64: ${{ secrets.DICIONARIO_CANAIS_B64 }}
          # ⛔ Um secret do GitHub para em 48 KB e os manifestos nao cabem:
          #    IDs de video sao aleatorios e nao comprimem. Vao em PARTES,
          #    concatenadas aqui em ordem.
          # ⚠️ Eram 3 partes (118 KB) as 14h de 21/09/2026 e viraram 5
          #    (174 KB) as 17h, quando os 10 mentores entraram. Por isso o
          #    passo le' ATE' 8 e ignora as vazias, em vez de fixar o numero:
          #    o acervo cresce, e um numero fixo quebra calado.
          # ⛔ Quem regravar UMA parte tem de regravar TODAS: metade de um
          #    tar.gz nao e' um tar.gz, e o `base64 -d` falha inteiro.
          MANIFESTOS_B64_1: ${{ secrets.MANIFESTOS_B64_1 }}
          MANIFESTOS_B64_2: ${{ secrets.MANIFESTOS_B64_2 }}
          MANIFESTOS_B64_3: ${{ secrets.MANIFESTOS_B64_3 }}
          MANIFESTOS_B64_4: ${{ secrets.MANIFESTOS_B64_4 }}
          MANIFESTOS_B64_5: ${{ secrets.MANIFESTOS_B64_5 }}
          MANIFESTOS_B64_6: ${{ secrets.MANIFESTOS_B64_6 }}
          MANIFESTOS_B64_7: ${{ secrets.MANIFESTOS_B64_7 }}
          MANIFESTOS_B64_8: ${{ secrets.MANIFESTOS_B64_8 }}
        run: |
          set -euo pipefail
          if [ -z "${DICIONARIO_B64:-}" ]; then
            echo "⛔ DICIONARIO_CANAIS_B64 ausente. Sem ele o radar nao sabe"
            echo "   o que enumerar, e isso e' proposital. Abortando."
            exit 1
          fi
          echo "$DICIONARIO_B64" | base64 -d > dicionario_canais.json
          mkdir -p manifestos
          # printf '%s' e nao `echo`: um unico \n no meio do base64 quebraria
          # a decodificacao inteira. A parte que nao existe vira string vazia
          # e nao atrapalha a concatenacao.
          : > manifestos.b64
          for i in 1 2 3 4 5 6 7 8; do
            eval "parte=\${MANIFESTOS_B64_$i:-}"
            printf '%s' "$parte" >> manifestos.b64
          done
          if [ -s manifestos.b64 ]; then
            base64 -d manifestos.b64 | tar xz -C .
            echo "manifestos restaurados: $(ls manifestos | wc -l) canais"
          else
            echo "⚠️ sem manifesto anterior: TODO video sera' tratado como novo."
          fi
          rm -f manifestos.b64

      - name: Estagio 1 - radar
        run: |
          python scripts/radar.py \
            --dicionario dicionario_canais.json \
            --manifestos manifestos \
            --canais canais \
            --saida novos.json \
            --so-codigo "${{ github.event.inputs.so_codigo }}"

      - name: Estagio 2 - coletar legendas dos novos
        if: ${{ github.event.inputs.seco != 'true' }}
        env:
          FTA_CHAVES: ${{ secrets.FTA_CHAVES }}
        run: |
          set -euo pipefail
          test -s novos.json
          python scripts/coletar.py --novos novos.json --saida legendas
        # ⛔ nunca baixa video. A FTA so' tem a rota /v1/transcript.

      - name: Estagio 3 - destilar
        if: ${{ github.event.inputs.seco != 'true' }}
        env:
          GEMINI_CHAVES: ${{ secrets.GEMINI_CHAVES }}
          NVIDIA_CHAVES: ${{ secrets.NVIDIA_CHAVES }}
          OPENROUTER_CHAVES: ${{ secrets.OPENROUTER_CHAVES }}
        run: |
          # ⭐ a cota do Gemini e' POR MODELO. Cair de modelo em modelo e' o
          #    que mantem isto vivo quando uma cota acaba.
          # ⭐ flash-lite fecha a cadeia: em 21/09/2026 foi o unico Gemini
          #    que respondeu 200 nas 7 chaves, com 3.6 e 3.5 em 429.
          python scripts/destilar.py --entrada legendas --saida fichas \
            --modelos "nemotron,gemini-3.6-flash,gemini-3.5-flash,gemini-3.7-flash,gemini-flash-lite-latest"

      - name: Estagio 4 - regenerar skills
        if: ${{ github.event.inputs.seco != 'true' }}
        # ⛔ UMA SKILL POR GRUPO. Desde 21/09/2026 o radar cobre dois acervos
        #    que nao se misturam: 15 canais de front-end e 10 mentores de
        #    daytrade. Sem --grupo, ficha de mentor entraria na skill de CSS.
        #    `|| true`: um grupo sem ficha nova nao e' erro, e nao pode
        #    derrubar a corrida do outro.
        run: |
          set -uo pipefail
          python scripts/gerar_skills.py --fichas fichas --saida skills \
            --canais canais --grupo css_frontend --nome css-frontend || true
          python scripts/gerar_skills.py --fichas fichas --saida skills \
            --canais canais --grupo mentores_fx --nome mentores-fx || true
          # ⭐ 23/09/2026 -- TERCEIRO grupo, a pedido do dono. C026 entra
          #    como maestro de IA, nao como front-end nem daytrade.
          # ⛔ NOME SEPARADO DE PROPOSITO. A skill `maestros-da-ia` que ja'
          #    existe tem 147.597 fichas e vem do pipeline LOCAL. Gerar
          #    aqui com o mesmo nome trocaria o acervo inteiro por um
          #    punhado de videos novos. A fusao e' passo SEPARADO e
          #    deliberado, nunca efeito colateral da corrida.
          python scripts/gerar_skills.py --fichas fichas --saida skills \
            --canais canais --grupo maestros_ia --nome maestros-ia-radar || true
          ls -la skills || true

      - name: Guardar saida como artefato (resgate manual se o commit falhar)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acervo-${{ github.run_number }}
          path: |
            novos.json
            manifestos/
            fichas/
            skills/
          retention-days: 30

      - name: Estagio 5 - guardar no Drive (resgate manual)
        # ⛔ roda MESMO se algo antes falhar: se o commit nao sair, o Drive
        #    e' o unico caminho para o dono alcancar o conhecimento novo.
        if: ${{ always() && github.event.inputs.seco != 'true' }}
        env:
          TOKEN_DRIVE_JSON: ${{ secrets.TOKEN_DRIVE_CRYPTOZPIN }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN_DRIVE_JSON:-}" ]; then
            echo "⚠️ sem token do Drive -- pulando. O artefato do Actions"
            echo "   ainda serve como resgate, por 30 dias."
            exit 0
          fi
          pip install --quiet google-api-python-client google-auth
          python scripts/guardar_no_drive.py --pasta "Acervo Radar"             --entrada fichas skills novos.json

      - name: Commit unico, no fim
        if: ${{ github.event.inputs.seco != 'true' }}
        run: |
          set -euo pipefail
          # ⛔ o dicionario e os manifestos NAO entram. Ver .gitignore --
          #    um unico ID de video revela o canal.
          rm -f dicionario_canais.json
          git config user.name  "radar-do-acervo"
          git config user.email "radar@localhost"
          git add canais skills fichas
          if git diff --cached --quiet; then
            echo "nada mudou nesta semana."
          else
            git commit -m "radar semanal: $(python -c "import json;print(json.load(open('novos.json'))['total'])") videos novos"
            git push
          fi
